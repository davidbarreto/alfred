{# Places lived: the add/edit dialog, delete, and the one-click fix when the open row is not the Home place's city. #}
<script>
(() => {
  const dialog = document.getElementById('lived-dialog');
  if (!dialog) return;
  const form = dialog.querySelector('form');
  const error = form.querySelector('.form-error');
  const deleteButton = form.querySelector('[data-delete]');
  async function send(method, url, body) {
    const res = await fetch(url, {
      method, headers: { 'Content-Type': 'application/json' }, body: body === undefined ? undefined : JSON.stringify(body),
    });
    return { ok: res.ok, status: res.status, data: await res.json().catch(() => ({})) };
  }
  const picker = initCityPicker({
    input: form.elements.city_text, idInput: form.elements.city_id, terminalInput: form.elements.city_text,
    newCity: initNewCityDialog({ dialog: document.getElementById('city-dialog'), send: (method, url, body) => send(method, url, body) }),
  });
  let editing = null;

  function open(row, born = false) {
    editing = row;
    error.textContent = '';
    form.querySelector('[data-title]').textContent = row ? `Edit ${row.city.name}` : (born ? 'Where you were born' : 'Add a place lived');
    picker.reset(row ? row.city : null);
    form.elements.from_date.value = row?.from_date || '';
    form.elements.to_date.value = row?.to_date || '';
    form.elements.born.checked = row ? !!row.born : born;
    form.elements.notes.value = row?.notes || '';
    deleteButton.classList.toggle('hidden', !row);
    dialog.showModal();
  }

  document.querySelectorAll('[data-lived-add]').forEach((b) => b.addEventListener('click', () => open(null)));
  document.querySelectorAll('[data-lived-born]').forEach((b) => b.addEventListener('click', () => open(null, true)));
  document.querySelectorAll('[data-lived-edit]').forEach((b) => b.addEventListener('click', () => open(JSON.parse(b.dataset.livedEdit))));
  form.querySelector('[data-close]').addEventListener('click', () => dialog.close());

  form.addEventListener('submit', async (event) => {
    event.preventDefault();
    const cityId = picker.value();
    if (!cityId) { error.textContent = 'Pick a city.'; return; }
    const body = {
      city_id: cityId, from_date: form.elements.from_date.value || null, to_date: form.elements.to_date.value || null,
      born: form.elements.born.checked, notes: form.elements.notes.value.trim() || null,
    };
    const { ok, data } = editing
      ? await send('PATCH', `/places/residences/${editing.id}`, body)
      : await send('POST', '/places/residences', body);
    if (!ok) { error.textContent = data.error || 'Something went wrong.'; return; }
    location.reload();
  });

  deleteButton.addEventListener('click', async () => {
    if (!editing || !confirm(`Delete ${editing.city.name} from Places lived?`)) return;
    const { ok, data } = await send('DELETE', `/places/residences/${editing.id}`);
    if (!ok) { error.textContent = data.error || 'Could not delete.'; return; }
    location.reload();
  });

  const follow = document.querySelector('[data-lived-follow]');
  if (follow) follow.addEventListener('click', async () => {
    const { ok, data } = await send('POST', '/places/residences/follow-home');
    if (!ok) { alert(data.error || 'Could not update Places lived.'); return; }
    location.reload();
  });
})();
</script>
