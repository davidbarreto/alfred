# Behavioral interview prep questions, tagged. Loaded on every deploy by seed_interview_prep_questions.py.
# Insert-only: missing questions are added; a question that already exists and has NO tags gets these tags;
# nothing is ever deleted or re-tagged. Tags are shared with stories (lowercase kebab-case) and created if missing.
# Add new questions here (text must be unique), or in the portal.
- text: "Tell me about a sync vs async decision you made. What forced the choice, what did you give up, and what constraint change would make you flip it?"
  tags: [trade-offs, async, decision, architecture]
- text: "Tell me about a migration strategy you chose. What were the options, what decided it, and how did you limit risk and keep a rollback path?"
  tags: [migration, decision, risk]
- text: "Walk me through a production incident where you found the root cause. How did you find it, including the dead ends, and what changed afterward to prevent it?"
  tags: [incident, debugging, failure]
- text: "Tell me about something you solved once for many teams instead of case by case. What was the before and after, and who adopted it?"
  tags: [platform, tooling, impact]
- text: "How do you handle schema evolution and compatibility, and what do you know about event-driven design (delivery guarantees, idempotent consumers, ordering)? Give a real example."
  tags: [distributed-systems, pub-sub, integration, architecture]
- text: "Tell me about a decision you drove that wasn't initially popular. Why did others resist, and how did you get alignment?"
  tags: [influence, decision, conflict]
- text: "Tell me about prioritizing across competing problems. How did you rank them, what did you deliberately not do, and how did you communicate that?"
