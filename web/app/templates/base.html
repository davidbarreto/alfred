<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Theme init: must run before first paint to avoid a light-mode flash -->
  <script>
    (function () {
      var stored = localStorage.getItem('theme');
      var theme = stored || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      document.documentElement.setAttribute('data-theme', theme);
    })();
  </script>

  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}Alfred{% endblock %} — Alfred Portal</title>

  <!-- Tabler icons webfont (outline, stroke-1.5) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3/dist/tabler-icons.min.css" />
  <!-- DaisyUI 4 component structure -->
  <link href="https://cdn.jsdelivr.net/npm/daisyui@4/dist/full.min.css" rel="stylesheet" />
  <!-- Tailwind CDN with custom semantic colors -->
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            surface: '#FAFAF9',
            sidebar: '#F5F4F0',
            accent:  { DEFAULT: '#378ADD', light: '#E6F1FB', dark: '#0C447C' },
            danger:  { DEFAULT: '#E24B4A', light: '#FCEBEB' },
            warn:    { DEFAULT: '#BA7517', light: '#FAEEDA' },
            ok:      { DEFAULT: '#639922', light: '#EAF3DE' },
          }
        }
      }
    }
  </script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/htmx.org@2/dist/htmx.min.js"></script>

  <style>
    /*
     * DaisyUI 4 uses oklch variables in the format "L% C H" (no function wrapper).
     * Override :root so all DaisyUI components pick up our neutral palette.
     * The gray scale and the app's semantic hex colors are also exposed as
     * CSS variables here so a single [data-theme="dark"] block can retheme
     * every template without editing them individually.
     */
    :root {
      --b1:  100% 0 0;          /* white — card/input surfaces */
      --b2:  98.2% 0.002 90;    /* #FAFAF9 — page background */
      --b3:  96.1% 0.004 80;    /* #F5F4F0 — sidebar / muted areas */
      --bc:  15% 0 0;           /* near-black — body text */
      --p:   58% 0.14 236;      /* #378ADD — accent blue (active/selected only) */
      --pc:  100% 0 0;          /* white text on blue */
      --s:   58% 0.14 236;
      --sc:  100% 0 0;
      --a:   58% 0.14 236;
      --ac:  100% 0 0;
      --n:   18% 0 0;           /* neutral dark */
      --nc:  100% 0 0;
      --in:  58% 0.14 236;      /* info = blue */
      --inc: 100% 0 0;
      --su:  59% 0.16 135;      /* success = #639922 green */
      --suc: 100% 0 0;
      --wa:  60% 0.15 65;       /* warning = #BA7517 amber */
      --wac: 100% 0 0;
      --er:  55% 0.2 27;        /* error = #E24B4A red */
      --erc: 100% 0 0;
      --rounded-box: 0.5rem;
      --rounded-btn: 0.375rem;
      --rounded-badge: 1rem;
      --border-btn: 1px;

      /* Tailwind gray scale (light) */
      --gray-50:  #F9FAFB;
      --gray-100: #F3F4F6;
      --gray-200: #E5E7EB;
      --gray-300: #D1D5DB;
      --gray-400: #9CA3AF;
      --gray-500: #6B7280;
      --gray-600: #4B5563;
      --gray-700: #374151;
      --gray-800: #1F2937;
      --gray-900: #111827;

      /* Neutral surfaces used as raw hex in templates (light) */
      --surface-page:    #FAFAF9;
      --surface-sidebar: #F5F4F0;
      --surface-hover:   #ECEAE4;
      --surface-card:    #FFFFFF;
      --surface-border:  #E5E7EB;

      /* Tinted badge/pill backgrounds + their paired text (light) */
      --tint-blue-bg:   #E6F1FB; --tint-blue-text:   #0C447C;
      --tint-red-bg:    #FCEBEB; --tint-red-text:    #E24B4A;
      --tint-amber-bg:  #FAEEDA; --tint-amber-text:  #BA7517; --tint-amber-text-2: #8A5A00;
      --tint-green-bg:  #EAF3DE; --tint-green-text:  #639922; --tint-green-text-2: #3E9C42; --tint-green-text-3: #2E7D32;
      --tint-orange-bg-1: #FCE8CC;
      --tint-orange-bg-2: #FDF1E2;
      --tint-orange-bg-3: #FDF3E7;
      --tint-green-bg-2:  #E9F5E9;
    }

    html[data-theme="dark"] {
      --b1:  20% 0 0;
      --b2:  13% 0 0;
      --b3:  16% 0 0;
      --bc:  92% 0 0;
      --p:   62% 0.15 236;
      --pc:  12% 0 0;
      --s:   62% 0.15 236;
      --sc:  12% 0 0;
      --a:   62% 0.15 236;
      --ac:  12% 0 0;
      --n:   85% 0 0;
      --nc:  15% 0 0;
      --in:  62% 0.15 236;
      --inc: 12% 0 0;
      --su:  65% 0.17 135;
      --suc: 12% 0 0;
      --wa:  68% 0.16 65;
      --wac: 12% 0 0;
      --er:  62% 0.2 27;
      --erc: 12% 0 0;

      --gray-50:  #1C1D20;
      --gray-100: #212226;
      --gray-200: #2C2D31;
      --gray-300: #3A3B40;
      --gray-400: #71727A;
      --gray-500: #8B8D95;
      --gray-600: #A6A8B0;
      --gray-700: #C1C3CA;
      --gray-800: #DDDEE3;
      --gray-900: #F3F4F6;

      --surface-page:    #121214;
      --surface-sidebar: #1A1B1E;
      --surface-hover:   #26272B;
      --surface-card:    #1E1F23;
      --surface-border:  #2C2D31;

      --tint-blue-bg:   #1C3A5C; --tint-blue-text:   #9CC7F2;
      --tint-red-bg:    #3A1C1C; --tint-red-text:    #F0716F;
      --tint-amber-bg:  #3A2A10; --tint-amber-text:  #E3A542; --tint-amber-text-2: #D99A3D;
      --tint-green-bg:  #1E2C14; --tint-green-text:  #8FC93F; --tint-green-text-2: #5FC363; --tint-green-text-3: #66BB6A;
      --tint-orange-bg-1: #3D2A12;
      --tint-orange-bg-2: #362711;
      --tint-orange-bg-3: #362711;
      --tint-green-bg-2:  #17251A;
    }

    /* Sidebar nav links */
    .nav-link {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.375rem 0.625rem;
      border-radius: 0.375rem;
      font-size: 0.8125rem;
      color: var(--gray-600);
      text-decoration: none;
      transition: background 0.1s, color 0.1s;
    }
    .nav-link:hover { background: var(--surface-hover); color: var(--gray-900); }
    .nav-link.active { background: var(--tint-blue-bg); color: var(--tint-blue-text); font-weight: 500; }
    .nav-link .ti { font-size: 1rem; width: 1.125rem; text-align: center; flex-shrink: 0; }

    /* Global card: thin border, no shadow */
    .card { box-shadow: none !important; border: 1px solid var(--surface-border); }
    /* Inputs: minimal ring */
    .input, .select, .textarea {
      border-color: var(--surface-border);
      background-color: var(--surface-card);
      color: var(--gray-900);
    }
    .input:focus, .select:focus { outline: none; border-color: #378ADD; box-shadow: 0 0 0 2px var(--tint-blue-bg); }

    /*
     * The rules below retheme Tailwind utilities that templates use directly
     * (gray-scale text/bg/border/divide, bg-white, and raw hex arbitrary
     * values like bg-[#FAFAF9]) instead of a semantic color name.
     *
     * These can't be handled by remapping the Tailwind config's gray palette
     * to CSS variables: the CDN's in-browser JIT compiler resolves each
     * color to a static rgb() at generation time (to support the /opacity
     * modifier), which bakes in whatever the variable evaluates to at that
     * moment rather than tracking it live — so config-level var()s silently
     * freeze at the light-mode value. Overriding the generated utility
     * classes directly (with !important, since source order vs. Tailwind's
     * injected stylesheet isn't guaranteed) avoids that.
     */
    html[data-theme="dark"] .text-gray-200 { color: var(--gray-200) !important; }
    html[data-theme="dark"] .text-gray-300 { color: var(--gray-300) !important; }
    html[data-theme="dark"] .text-gray-400 { color: var(--gray-400) !important; }
    html[data-theme="dark"] .text-gray-500 { color: var(--gray-500) !important; }
    html[data-theme="dark"] .text-gray-600 { color: var(--gray-600) !important; }
    html[data-theme="dark"] .text-gray-700 { color: var(--gray-700) !important; }
    html[data-theme="dark"] .text-gray-800 { color: var(--gray-800) !important; }
    html[data-theme="dark"] .text-gray-900 { color: var(--gray-900) !important; }
    html[data-theme="dark"] .hover\:text-gray-500:hover { color: var(--gray-500) !important; }
    html[data-theme="dark"] .hover\:text-gray-600:hover { color: var(--gray-600) !important; }
    html[data-theme="dark"] .hover\:text-gray-700:hover { color: var(--gray-700) !important; }
    html[data-theme="dark"] .hover\:text-gray-900:hover { color: var(--gray-900) !important; }
    html[data-theme="dark"] .group:hover .group-hover\:text-gray-500 { color: var(--gray-500) !important; }

    html[data-theme="dark"] .bg-gray-50  { background-color: var(--gray-50) !important; }
    html[data-theme="dark"] .bg-gray-100 { background-color: var(--gray-100) !important; }
    html[data-theme="dark"] .bg-gray-200 { background-color: var(--gray-200) !important; }
    html[data-theme="dark"] .bg-gray-300 { background-color: var(--gray-300) !important; }
    html[data-theme="dark"] .bg-gray-400 { background-color: var(--gray-400) !important; }
    html[data-theme="dark"] .bg-gray-900 { background-color: var(--gray-900) !important; }
    html[data-theme="dark"] .hover\:bg-gray-50:hover  { background-color: var(--gray-50) !important; }
    html[data-theme="dark"] .hover\:bg-gray-100:hover { background-color: var(--gray-100) !important; }
    html[data-theme="dark"] .hover\:bg-gray-200:hover { background-color: var(--gray-200) !important; }

    html[data-theme="dark"] .border-gray-50  { border-color: var(--gray-50) !important; }
    html[data-theme="dark"] .border-gray-100 { border-color: var(--gray-100) !important; }
    html[data-theme="dark"] .border-gray-200 { border-color: var(--gray-200) !important; }
    html[data-theme="dark"] .border-gray-300 { border-color: var(--gray-300) !important; }
    html[data-theme="dark"] .hover\:border-gray-300:hover { border-color: var(--gray-300) !important; }
    html[data-theme="dark"] .divide-gray-50  > :not([hidden]) ~ :not([hidden]) { border-color: var(--gray-50) !important; }
    html[data-theme="dark"] .divide-gray-100 > :not([hidden]) ~ :not([hidden]) { border-color: var(--gray-100) !important; }

    html[data-theme="dark"] .bg-white  { background-color: var(--surface-card) !important; }
    html[data-theme="dark"] .bg-\[\#FAFAF9\]  { background-color: var(--surface-page) !important; }
    html[data-theme="dark"] .bg-\[\#F5F4F0\]  { background-color: var(--surface-sidebar) !important; }
    html[data-theme="dark"] .bg-\[\#ECEAE4\]  { background-color: var(--surface-hover) !important; }

    html[data-theme="dark"] .bg-\[\#E6F1FB\]  { background-color: var(--tint-blue-bg) !important; }
    html[data-theme="dark"] .text-\[\#0C447C\] { color: var(--tint-blue-text) !important; }

    html[data-theme="dark"] .bg-\[\#FCEBEB\]  { background-color: var(--tint-red-bg) !important; }
    html[data-theme="dark"] .bg-\[\#E24B4A\]  { background-color: var(--tint-red-text) !important; }
    html[data-theme="dark"] .text-\[\#E24B4A\] { color: var(--tint-red-text) !important; }
    html[data-theme="dark"] .border-\[\#E24B4A\] { border-color: var(--tint-red-text) !important; }

    html[data-theme="dark"] .bg-\[\#FAEEDA\]  { background-color: var(--tint-amber-bg) !important; }
    html[data-theme="dark"] .bg-\[\#BA7517\]  { background-color: var(--tint-amber-text) !important; }
    html[data-theme="dark"] .text-\[\#BA7517\] { color: var(--tint-amber-text) !important; }
    html[data-theme="dark"] .text-\[\#8A5A00\] { color: var(--tint-amber-text-2) !important; }
    html[data-theme="dark"] .text-\[\#8A5A0B\] { color: var(--tint-amber-text-2) !important; }
    html[data-theme="dark"] .bg-\[\#FCE8CC\]  { background-color: var(--tint-orange-bg-1) !important; }
    html[data-theme="dark"] .bg-\[\#FDF1E2\]  { background-color: var(--tint-orange-bg-2) !important; }
    html[data-theme="dark"] .bg-\[\#FDF3E7\]  { background-color: var(--tint-orange-bg-3) !important; }

    html[data-theme="dark"] .bg-\[\#EAF3DE\]  { background-color: var(--tint-green-bg) !important; }
    html[data-theme="dark"] .bg-\[\#639922\]  { background-color: var(--tint-green-text) !important; }
    html[data-theme="dark"] .text-\[\#639922\] { color: var(--tint-green-text) !important; }
    html[data-theme="dark"] .bg-\[\#3E9C42\]  { background-color: var(--tint-green-text-2) !important; }
    html[data-theme="dark"] .text-\[\#3E9C42\] { color: var(--tint-green-text-2) !important; }
    html[data-theme="dark"] .border-\[\#3E9C42\] { border-color: var(--tint-green-text-2) !important; }
    html[data-theme="dark"] .text-\[\#2E7D32\] { color: var(--tint-green-text-3) !important; }
    html[data-theme="dark"] .bg-\[\#E9F5E9\]  { background-color: var(--tint-green-bg-2) !important; }
  </style>
</head>
<body class="bg-[#FAFAF9] text-gray-900 antialiased">

  <!-- Mobile top bar -->
  <header class="md:hidden fixed top-0 left-0 right-0 z-40 flex items-center justify-between px-4 bg-[#F5F4F0] border-b border-gray-200 h-12">
    <span class="text-sm font-semibold text-gray-900 tracking-tight">Alfred</span>
    <button id="sidebar-toggle" class="p-1.5 rounded hover:bg-[#ECEAE4] text-gray-600" aria-label="Open menu">
      <i class="ti ti-menu-2 text-xl leading-none"></i>
    </button>
  </header>

  <!-- Sidebar backdrop (mobile only) -->
  <div id="sidebar-backdrop" class="hidden fixed inset-0 bg-black/30 z-20 md:hidden"></div>

  <div class="flex h-dvh pt-12 md:pt-0">

    <!-- Sidebar -->
    <aside id="sidebar" class="fixed md:static top-12 md:top-0 bottom-0 left-0 z-30 w-[200px] shrink-0 bg-[#F5F4F0] border-r border-gray-200 flex flex-col py-5 px-2 -translate-x-full md:translate-x-0 transition-transform duration-200 ease-in-out overflow-y-auto">

      <div class="px-3 mb-5 hidden md:block">
        <span class="text-sm font-semibold text-gray-900 tracking-tight">Alfred</span>
      </div>

      <nav class="flex flex-col gap-0.5 flex-1">
        <a href="/" class="nav-link {% if active_page == 'dashboard' %}active{% endif %}">
          <i class="ti ti-layout-dashboard"></i>Dashboard
        </a>
        <a href="/tasks" class="nav-link {% if active_page == 'tasks' %}active{% endif %}">
          <i class="ti ti-checklist"></i>Tasks
        </a>
        <a href="/shopping" class="nav-link {% if active_page == 'shopping' %}active{% endif %}">
          <i class="ti ti-shopping-cart"></i>Shopping
        </a>
        <a href="/calendar" class="nav-link {% if active_page == 'calendar' %}active{% endif %}">
          <i class="ti ti-calendar"></i>Calendar
        </a>
        <a href="/notes" class="nav-link {% if active_page == 'notes' %}active{% endif %}">
          <i class="ti ti-notes"></i>Notes
        </a>
        <a href="/contacts" class="nav-link {% if active_page == 'contacts' %}active{% endif %}">
          <i class="ti ti-address-book"></i>Contacts
        </a>
        <a href="/finance" class="nav-link {% if active_page == 'finance' %}active{% endif %}">
          <i class="ti ti-wallet"></i>Finance
        </a>
        <a href="/insights" class="nav-link {% if active_page == 'insights' %}active{% endif %}">
          <i class="ti ti-chart-bar"></i>Insights
        </a>
        <a href="/languages" class="nav-link {% if active_page == 'languages' %}active{% endif %}">
          <i class="ti ti-language"></i>Languages
        </a>
        <a href="/briefing" class="nav-link {% if active_page == 'briefing' %}active{% endif %}">
          <i class="ti ti-sun-moon"></i>Briefing
        </a>
        <a href="/watcher" class="nav-link {% if active_page == 'watcher' %}active{% endif %}">
          <i class="ti ti-radar-2"></i>Watcher
        </a>
      </nav>

      <div class="border-t border-gray-200 pt-2 mt-auto space-y-0.5">
        <a href="/chat" class="nav-link {% if active_page == 'chat' %}active{% endif %}">
          <i class="ti ti-message-circle-2"></i>Chat
        </a>
        <button id="theme-toggle" type="button" class="nav-link w-full">
          <i class="ti ti-moon" id="theme-toggle-icon"></i><span id="theme-toggle-label">Dark mode</span>
        </button>
        <a href="/logout" class="nav-link text-gray-400 hover:text-gray-600">
          <i class="ti ti-logout"></i>Sign out
        </a>
      </div>

    </aside>

    <!-- Main content -->
    <main class="flex-1 overflow-y-auto min-w-0">
      {% block content %}{% endblock %}
    </main>

  </div>

  <script>
    (function () {
      var toggle = document.getElementById('sidebar-toggle');
      var sidebar = document.getElementById('sidebar');
      var backdrop = document.getElementById('sidebar-backdrop');

      function openSidebar() {
        sidebar.classList.remove('-translate-x-full');
        backdrop.classList.remove('hidden');
      }

      function closeSidebar() {
        sidebar.classList.add('-translate-x-full');
        backdrop.classList.add('hidden');
      }

      toggle.addEventListener('click', function () {
        if (sidebar.classList.contains('-translate-x-full')) {
          openSidebar();
        } else {
          closeSidebar();
        }
      });

      backdrop.addEventListener('click', closeSidebar);
    })();
  </script>

  <script>
    (function () {
      var toggle = document.getElementById('theme-toggle');
      var icon = document.getElementById('theme-toggle-icon');
      var label = document.getElementById('theme-toggle-label');
      var root = document.documentElement;

      function applyIcon(theme) {
        icon.classList.toggle('ti-moon', theme !== 'dark');
        icon.classList.toggle('ti-sun', theme === 'dark');
        label.textContent = theme === 'dark' ? 'Light mode' : 'Dark mode';
      }

      applyIcon(root.getAttribute('data-theme'));

      toggle.addEventListener('click', function () {
        var next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
        root.setAttribute('data-theme', next);
        localStorage.setItem('theme', next);
        applyIcon(next);
      });

      window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function (e) {
        if (localStorage.getItem('theme')) return;
        var theme = e.matches ? 'dark' : 'light';
        root.setAttribute('data-theme', theme);
        applyIcon(theme);
      });
    })();
  </script>

</body>
</html>
