<form id="tx-edit-form" class="flex flex-col gap-3" data-id="{{ t.id }}" data-original-date="{{ t.date[:10] }}">
  <div class="grid grid-cols-2 gap-3">
    <label class="text-xs text-gray-500">Amount
      <input name="amount" type="number" step="0.01" required value="{{ t.amount }}" class="input input-sm input-bordered w-full text-sm text-gray-900">
    </label>
    <label class="text-xs text-gray-500">Date
      <input name="date" type="date" required value="{{ t.date[:10] }}" class="input input-sm input-bordered w-full text-sm text-gray-900">
    </label>
  </div>
  <div class="grid grid-cols-2 gap-3">
    <label class="text-xs text-gray-500">Type
      <select name="type" class="select select-sm select-bordered w-full text-sm text-gray-900">
        {% for value in ("expense", "income") %}<option value="{{ value }}" {{ 'selected' if t.type == value }}>{{ value | capitalize }}</option>{% endfor %}
        {% if t.type == "transfer" %}<option value="transfer" selected>Transfer</option>{% endif %}
      </select>
    </label>
    <label class="text-xs text-gray-500">Account
      <select name="account_id" class="select select-sm select-bordered w-full text-sm text-gray-900">
        {% for a in accounts %}<option value="{{ a.id }}" {{ 'selected' if a.id == t.account_id }}>{{ a.name }}</option>{% endfor %}
      </select>
    </label>
  </div>
  <label class="text-xs text-gray-500">Merchant
    <input name="merchant" type="text" value="{{ t.merchant or '' }}" class="input input-sm input-bordered w-full text-sm text-gray-900">
  </label>
  <label class="text-xs text-gray-500">Category
    <select name="category_id" class="select select-sm select-bordered w-full text-sm text-gray-900">
      <option value="">— none —</option>
      {% for c in categories %}<option value="{{ c.id }}" {{ 'selected' if c.id == t.category_id }}>{{ c.name }}</option>{% endfor %}
    </select>
  </label>
  <div class="text-xs text-gray-500">Tags
    <input name="tags" type="text" value="{{ (t.tags or []) | join(', ') }}" placeholder="e.g. Travel, Work" data-tag-input data-known='{{ tags | map(attribute="name") | list | tojson }}' class="input input-sm input-bordered w-full text-sm text-gray-900">
  </div>
  <label class="text-xs text-gray-500">Description
    <input name="description" type="text" value="{{ t.description or '' }}" class="input input-sm input-bordered w-full text-sm text-gray-900">
  </label>
  <label class="text-xs text-gray-500">Note
    <input name="note" type="text" value="{{ t.note or '' }}" class="input input-sm input-bordered w-full text-sm text-gray-900">
  </label>
  <p id="tx-edit-error" class="text-xs text-[#E24B4A] hidden"></p>
  <div class="flex justify-end gap-2">
    <button type="button" class="btn btn-sm btn-ghost tx-edit-cancel" data-id="{{ t.id }}">Cancel</button>
    <button type="submit" class="btn btn-sm btn-primary">Save</button>
  </div>
</form>
