{% extends "base.html" %}
{% set active_page = "finance" %}
{% block title %}Budgets{% endblock %}

{% block content %}
<div class="p-6 space-y-4">

  <div class="flex items-center gap-2">
    <a href="/finance/budgets/overview" class="text-gray-400 hover:text-gray-600" title="Back to spend vs. planned"><i class="ti ti-arrow-left text-sm"></i></a>
    <h1 class="text-base font-semibold text-gray-900">Edit budgets</h1>
  </div>

  <!-- Monthly targets -->
  <div class="bg-white border border-gray-200 rounded-lg p-4">
    <div class="flex items-center justify-between mb-3">
      <h2 class="text-sm font-medium text-gray-900">Monthly targets</h2>
      <div class="flex items-center gap-2">
        <button type="button" onclick="fillBudgetAverages()" class="btn btn-sm btn-ghost" title="Fill empty limits with the average of the last 12 completed months (not saved until you click Save)">Use averages</button>
        <button id="budget-targets-save" onclick="saveBudgetTargets()" class="btn btn-sm btn-primary">Save</button>
      </div>
    </div>
    <p id="budget-targets-error" class="text-xs text-[#E24B4A] hidden mb-2"></p>
    <div id="budget-targets-list">
      {% include "_finance_budgets_targets.html" %}
    </div>
  </div>

</div>

<script>
const CURRENCY_SYMBOL = {{ currency_symbol | tojson }};

function fmtMoney(n) {
  return n.toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}
function updateBudgetTotals() {
  const sum = sel => Array.from(document.querySelectorAll(sel))
    .reduce((acc, el) => acc + (parseFloat(el.dataset.average ?? el.value) || 0), 0);
  const avgEl = document.getElementById("budget-total-average");
  const limEl = document.getElementById("budget-total-limits");
  if (!avgEl || !limEl) return;
  avgEl.textContent = CURRENCY_SYMBOL + fmtMoney(sum(".budget-average"));
  limEl.textContent = CURRENCY_SYMBOL + fmtMoney(sum(".budget-target-input"));
}

function useBudgetAverage(btn) {
  btn.closest("div.flex.items-center.justify-between").querySelector(".budget-target-input").value = btn.dataset.average;
  updateBudgetTotals();
}

function fillBudgetAverages() {
  document.querySelectorAll(".budget-average").forEach(btn => {
    const input = btn.closest("div.flex.items-center.justify-between").querySelector(".budget-target-input");
    if (input.value === "") input.value = btn.dataset.average;
  });
  updateBudgetTotals();
}

function refreshTagPicker() {
  const picker = document.getElementById("budget-tag-picker");
  if (!picker) return;
  picker.replaceChildren();
  document.querySelectorAll(".budget-tag-row.hidden").forEach(row => {
    picker.append(new Option(row.dataset.tagName, row.dataset.tagId));
  });
  const none = picker.options.length === 0;
  picker.disabled = none;
  picker.nextElementSibling.disabled = none;
  if (none) picker.append(new Option("All tags added", ""));
}

function addTagBudget() {
  const picker = document.getElementById("budget-tag-picker");
  if (!picker.value) return;
  const row = document.querySelector(`.budget-tag-row[data-tag-id="${picker.value}"]`);
  row.classList.remove("hidden");
  row.querySelector("input").focus();
  refreshTagPicker();
}

// Hidden rows keep an empty value, so saving sends amount null and clears the budget.
function removeTagBudget(btn) {
  const row = btn.closest(".budget-tag-row");
  row.querySelector("input").value = "";
  row.classList.add("hidden");
  refreshTagPicker();
}

async function saveBudgetTargets() {
  const btn = document.getElementById("budget-targets-save");
  const errEl = document.getElementById("budget-targets-error");
  errEl.classList.add("hidden");
  btn.disabled = true;
  const targets = Array.from(document.querySelectorAll(".budget-target-input")).map(input => ({
    category_id: parseInt(input.dataset.categoryId, 10),
    amount: input.value === "" ? null : parseFloat(input.value),
  }));
  const tag_targets = Array.from(document.querySelectorAll(".budget-tag-input")).map(input => ({
    tag_id: parseInt(input.dataset.tagId, 10),
    amount: input.value === "" ? null : parseFloat(input.value),
  }));
  try {
    const res = await fetch("/finance/budgets/targets", {
      method: "PUT",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ targets, tag_targets }),
    });
    if (!res.ok) throw new Error(await res.text());
    document.getElementById("budget-targets-list").innerHTML = await res.text();
    updateBudgetTotals();
    refreshTagPicker();
  } catch (err) {
    errEl.textContent = "Failed to save budgets.";
    errEl.classList.remove("hidden");
  } finally {
    btn.disabled = false;
  }
}

document.getElementById("budget-targets-list").addEventListener("input", updateBudgetTotals);
updateBudgetTotals();
refreshTagPicker();

</script>
{% endblock %}
