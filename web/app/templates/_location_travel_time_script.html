<script>
document.getElementById('travel-time-form')?.addEventListener('submit', async (event) => {
  event.preventDefault();
  const form = event.target;
  const data = new FormData(form);
  const error = form.querySelector('[data-form-error]');
  error.textContent = '';
  try {
    await locationSend(`/locations/${form.dataset.locationId}/travel-times`, 'PUT', {
      destination_id: Number(data.get('destination_id')), mode: data.get('mode'), minutes: Number(data.get('minutes')),
    });
    location.reload();
  } catch (e) { error.textContent = e.message; }
});
document.querySelectorAll('[data-delete-travel-time]').forEach((button) => {
  button.addEventListener('click', async () => {
    const error = document.getElementById('travel-time-error');
    error.textContent = '';
    try {
      await locationSend(`/locations/travel-times/${button.dataset.deleteTravelTime}`, 'DELETE');
      document.getElementById(`travel-time-${button.dataset.deleteTravelTime}`)?.remove();
    } catch (e) { error.textContent = e.message; }
  });
});
</script>
