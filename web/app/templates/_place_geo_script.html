{# Cover menu, edit dialog and delete for a city or country page. Needs cover_base, delete_confirm, after_delete. #}
<script>
(() => {
  const BASE = {{ cover_base | tojson }};
  const msg = document.getElementById('cover-msg');
  const say = (text) => { msg.textContent = text; };
  async function json(res) { return res.json().catch(() => ({})); }
  async function upload(form) {
    say('Saving the cover…');
    const res = await fetch(`${BASE}/cover`, { method: 'PUT', body: form });
    const data = await json(res);
    if (!res.ok) { say(data.error || 'Could not save the cover.'); return; }
    location.reload();
  }
  const file = document.getElementById('cover-file');
  file.addEventListener('change', () => {
    if (!file.files.length) return;
    const form = new FormData(); form.append('file', file.files[0]); upload(form);
  });
  const actions = {
    async find() {
      say('Looking on Wikipedia…');
      const res = await fetch(`${BASE}/cover/find`, { method: 'POST' });
      const data = await json(res);
      if (!res.ok) { say(data.error || 'No photo found.'); return; }
      location.reload();
    },
    upload() { file.click(); },
    url() {
      const address = prompt('Address of an image (it is downloaded once and kept here):');
      if (!address || !address.trim()) return;
      const form = new FormData(); form.append('url', address.trim()); upload(form);
    },
    choose() { picker.open(); },
    async remove() {
      if (!confirm('Remove the cover photo?')) return;
      const res = await fetch(`${BASE}/cover`, { method: 'DELETE' });
      if (!res.ok) { say((await json(res)).error || 'Could not remove the cover.'); return; }
      location.reload();
    },
    async delete() {
      if (!confirm({{ delete_confirm | tojson }})) return;
      const res = await fetch(BASE, { method: 'DELETE' });
      if (!res.ok) { alert((await json(res)).error || 'Could not delete.'); return; }
      location.href = {{ after_delete | tojson }};
    },
  };
  // The photo picker: the article's images (cities) or a Commons search; choosing one sets it as the cover.
  const picker = (() => {
    const dialog = document.getElementById('cover-picker');
    const grid = document.getElementById('cover-picker-grid');
    const note = document.getElementById('cover-picker-msg');
    const search = document.getElementById('cover-picker-search');
    const sources = dialog.querySelectorAll('[data-picker-source]');
    let source = sources.length ? 'article' : 'commons';
    let loaded = null;
    const el = (tag, cls, text) => { const n = document.createElement(tag); if (cls) n.className = cls; if (text) n.textContent = text; return n; };
    function tile(photo) {
      const button = el('button', 'picker-tile');
      button.type = 'button';
      button.title = photo.title.replace(/^File:/, '');
      const img = el('img');
      img.src = photo.thumb_url; img.alt = button.title; img.loading = 'lazy'; img.referrerPolicy = 'no-referrer';
      button.append(img, el('span', 'picker-meta', `${photo.width}×${photo.height} · ${photo.credit.replace(/^Photo:\s*/, '').replace(/, via Wikimedia Commons$/, '')}`));
      button.addEventListener('click', () => choose(photo));
      return button;
    }
    async function load() {
      const q = search.q.value.trim();
      const key = `${source}|${source === 'commons' ? q : ''}`;
      if (key === loaded) return;
      loaded = key;
      grid.replaceChildren();
      note.textContent = 'Looking on Wikimedia…';
      const params = new URLSearchParams({ source });
      if (source === 'commons' && q) params.set('q', q);
      const res = await fetch(`${BASE}/cover/candidates?${params}`);
      const data = await json(res);
      if (!res.ok) { loaded = null; note.textContent = data.error || 'Could not load photos.'; return; }
      note.textContent = data.length ? `${data.length} photo${data.length === 1 ? '' : 's'}. Choose one to make it the cover.`
        : (source === 'article' ? 'No large photos in the article. Try the Commons search.' : 'No large photos found. Try other words.');
      grid.replaceChildren(...data.map(tile));
    }
    async function choose(photo) {
      note.textContent = 'Saving the cover…';
      const form = new FormData(); form.append('commons_file', photo.title);
      const res = await fetch(`${BASE}/cover`, { method: 'PUT', body: form });
      if (!res.ok) { note.textContent = (await json(res)).error || 'Could not save the cover.'; return; }
      location.reload();
    }
    sources.forEach((button) => button.addEventListener('click', () => {
      source = button.dataset.pickerSource;
      sources.forEach((b) => b.classList.toggle('btn-active', b === button));
      search.hidden = source !== 'commons';
      load();
    }));
    search.addEventListener('submit', (event) => { event.preventDefault(); load(); });
    dialog.querySelector('[data-picker-close]').addEventListener('click', () => dialog.close());
    return { open() { dialog.showModal(); load(); } };
  })();

  document.querySelectorAll('[data-cover-action]').forEach((button) => {
    button.addEventListener('click', () => { document.activeElement.blur(); actions[button.dataset.coverAction](); });
  });

  const dialog = document.getElementById('edit-dialog');
  document.getElementById('edit-open').addEventListener('click', () => dialog.showModal());
  dialog.querySelector('[data-close]').addEventListener('click', () => dialog.close());
  dialog.querySelector('form').addEventListener('submit', async (event) => {
    event.preventDefault();
    const form = event.target;
    const body = {};
    for (const input of form.querySelectorAll('[name]')) {
      const value = input.value.trim();
      if (input.dataset.kind === 'number') body[input.name] = value === '' ? null : Number(value);
      else if (input.dataset.kind === 'id') body[input.name] = Number(value);
      else body[input.name] = value || (input.required ? value : null);
    }
    const res = await fetch(BASE, { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
    const data = await json(res);
    if (!res.ok) { form.querySelector('.form-error').textContent = data.error || 'Something went wrong.'; return; }
    location.reload();
  });
})();
</script>
