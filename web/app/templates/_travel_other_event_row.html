<div class="flex items-center gap-2" data-other-event="{{ e.event_id }}" data-date="{{ e.start_datetime[:10] }}">
  {% if e.recurring %}<input type="checkbox" class="checkbox checkbox-xs other-event-pick" aria-label="Select {{ e.title }}">{% else %}<span class="w-4"></span>{% endif %}
  <p class="text-sm text-amber-900 grow">{{ e.start_datetime[:16].replace('T', ' ') }} · {{ e.title }}{% if e.recurring %} <span class="text-[11px]">(recurring)</span>{% endif %}{% if e.snoozed %} <span class="text-[11px]">· snoozed</span>{% endif %}</p>
  {% if e.recurring %}<button type="button" class="btn btn-xs btn-ghost other-event-skip" title="Leave this occurrence out of Alfred's calendar views and reminders (Google is not told)">Skip</button>{% endif %}
</div>
