{# The Map card of a city or country page. Needs `map_scope` ('city' or 'country'), `map_owner_id` and `groups`. #}
<div class="card bg-white" id="{{ map_scope }}-map">
  <div class="card-body p-5 space-y-2">
    <div class="flex flex-wrap items-center justify-between gap-2">
      <h2 class="text-sm font-semibold text-gray-900">Map</h2>
      <div class="flex gap-1">
        <a class="btn btn-xs btn-ghost" href="/places/map"><i class="ti ti-world"></i> World</a>
        <a class="btn btn-xs btn-outline" href="/places/{{ 'cities' if map_scope == 'city' else 'countries' }}/{{ map_owner_id }}/map.csv" title="A CSV for Google My Maps" id="{{ map_scope }}-map-csv"><i class="ti ti-download"></i> Map pins</a>
      </div>
    </div>
    <div class="places-map places-map-card" data-map-data="/places/map/data?{{ map_scope }}_id={{ map_owner_id }}" data-fit="{{ map_scope }}"></div>
    {% include "_places_map_legend.html" %}
  </div>
</div>
