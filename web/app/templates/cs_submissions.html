{% extends "base.html" %}
{% set active_page = "cs" %}
{% block title %}CS Coach — Submissions{% endblock %}

{% block content %}
<div class="p-6 space-y-4">

  <!-- Breadcrumb -->
  <div class="flex items-center gap-2 text-xs text-gray-400">
    <a href="/cs" class="hover:text-gray-600">CS Coach</a>
    <i class="ti ti-chevron-right text-gray-300"></i>
    <span class="text-gray-700 font-medium">Submissions</span>
  </div>

  <h1 class="text-base font-semibold text-gray-900">Submissions</h1>

  <!-- Filters -->
  <form method="get" action="/cs/submissions" class="card bg-white">
    <div class="card-body p-4">
      <div class="flex flex-row flex-wrap items-end gap-3">
        <div>
          <label class="block text-xs text-gray-400 mb-1">Problem name</label>
          <input type="text" name="q" value="{{ filters.q or '' }}" placeholder="Search by name"
                 class="input input-sm input-bordered text-sm w-48">
        </div>
        <div>
          <label class="block text-xs text-gray-400 mb-1">Provider</label>
          <select name="platform_id" class="select select-sm select-bordered text-sm">
            <option value="">All</option>
            {% for p in platforms %}
            <option value="{{ p.id }}" {% if filters.platform_id == p.id | string %}selected{% endif %}>{{ p.code | title }}</option>
            {% endfor %}
          </select>
        </div>
        <div>
          <label class="block text-xs text-gray-400 mb-1">Category</label>
          <select name="tag" class="select select-sm select-bordered text-sm">
            <option value="">All</option>
            {% for t in tags %}
            <option value="{{ t }}" {% if filters.tag == t %}selected{% endif %}>{{ t | title }}</option>
            {% endfor %}
          </select>
        </div>
        <div>
          <label class="block text-xs text-gray-400 mb-1">Status</label>
          <select name="verdict" class="select select-sm select-bordered text-sm">
            <option value="">All</option>
            {% for v in ["accepted", "wrong_answer", "time_limit_exceeded", "memory_limit_exceeded", "runtime_error", "compile_error", "other"] %}
            <option value="{{ v }}" {% if filters.verdict == v %}selected{% endif %}>{{ v | replace('_', ' ') | title }}</option>
            {% endfor %}
          </select>
        </div>
        <button type="submit" class="btn btn-sm bg-[#378ADD] text-white hover:bg-[#2f7bc4] border-none">Apply</button>
        {% if filters %}
        <a href="/cs/submissions" class="text-xs text-gray-400 hover:text-gray-600">Clear filters</a>
        {% endif %}
      </div>
    </div>
  </form>

  <div class="card bg-white">
    <div class="card-body p-5" id="submissions-list"
         hx-get="/cs/submissions-list-section?{{ filters | urlencode }}"
         hx-trigger="load"
         hx-swap="innerHTML">
      <div class="flex items-center justify-center py-16">
        <span class="loading loading-spinner loading-md text-[#378ADD]"></span>
      </div>
    </div>
  </div>

</div>
{% endblock %}
