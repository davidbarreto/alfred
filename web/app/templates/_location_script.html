<script>
async function locationSend(url, method, body) {
  const res = await fetch(url, {
    method, headers: { 'Content-Type': 'application/json' }, body: body === undefined ? undefined : JSON.stringify(body),
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error((data && data.error) || 'Something went wrong.');
  return data;
}

function locationBody(form) {
  const data = new FormData(form);
  const body = {
    name: data.get('name'),
    address: data.get('address') || null,
    maps_url: data.get('maps_url') || null,
    coordinates: (data.get('coordinates') || '').trim() || null,
    opening_hours: data.get('opening_hours') || null,
    notes: data.get('notes') || null,
  };
  const kind = (data.get('kind') || '').trim();
  if (kind) body.kind = kind;
  if (form.querySelector('[name="category_ids"]')) body.category_ids = data.getAll('category_ids').map(Number);
  if (form.cityPicker && form.cityPicker.touched()) body.city_id = form.cityPicker.value();
  return body;
}

// The edit form's City picker: the place's city, required (no clear), "New city…" opens the shared dialog.
document.querySelectorAll('[data-location-form]').forEach((form) => {
  const text = form.elements.city_text;
  if (!text) return;
  form.cityPicker = initCityPicker({
    input: text, idInput: form.elements.city_id, terminalInput: text,
    newCity: initNewCityDialog({ dialog: document.getElementById('city-dialog'), send: async (method, url, body) => {
      const res = await fetch(url, { method, headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
      return { ok: res.ok, status: res.status, data: await res.json().catch(() => ({})) };
    } }),
  });
  form.cityPicker.reset(JSON.parse(form.querySelector('[data-city]').textContent));
});

// A form submits to its data-url with its data-method; on success the page opens the saved location
// (with ?moved=1 when Home's address or city changed, so the page can say what that does and does not update).
document.querySelectorAll('[data-location-form]').forEach((form) => {
  form.addEventListener('submit', async (event) => {
    event.preventDefault();
    const error = form.querySelector('[data-form-error]');
    error.textContent = '';
    try {
      const saved = await locationSend(form.dataset.url, form.dataset.method, locationBody(form));
      const homeMoved = form.dataset.homeAddress !== undefined && saved.kind === 'home'
        && ((saved.address || '') !== form.dataset.homeAddress || String(saved.city.id) !== form.dataset.homeCity);
      window.location.href = `/locations/${saved.id}${homeMoved ? '?moved=1' : ''}`;
    } catch (e) { error.textContent = e.message; }
  });
});
</script>
