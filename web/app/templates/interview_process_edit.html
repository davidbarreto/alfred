{% extends "base.html" %}
{% set active_page = "interviews" %}
{% block title %}Edit — {{ process.role_title }}{% endblock %}

{% block content %}
<div class="p-6 space-y-4 max-w-2xl">

  <div class="flex items-center gap-2">
    <a href="/interviews/{{ process.id }}" class="text-gray-400 hover:text-gray-600"><i class="ti ti-arrow-left text-sm"></i></a>
    <h1 class="text-base font-semibold text-gray-900">Edit process</h1>
  </div>

  <form method="post" action="/interviews/{{ process.id }}/update" class="bg-white border border-gray-200 rounded-lg p-4 flex flex-col gap-3">
    <div class="grid grid-cols-2 gap-3">
      <div>
        <label class="text-xs text-gray-500 mb-1 block">Company</label>
        <select name="company_id" class="border border-gray-200 rounded-lg px-3 py-2 text-sm bg-white w-full focus:outline-none focus:ring-1 focus:ring-[#378ADD]">
          {% for c in companies %}
          <option value="{{ c.id }}" {% if c.id == process.company_id %}selected{% endif %}>{{ c.name }}</option>
          {% endfor %}
        </select>
      </div>
      <div>
        <label class="text-xs text-gray-500 mb-1 block">Role title</label>
        <input name="role_title" type="text" value="{{ process.role_title }}"
               class="border border-gray-200 rounded-lg px-3 py-2 text-sm bg-white w-full focus:outline-none focus:ring-1 focus:ring-[#378ADD]" />
      </div>
    </div>

    <div class="grid grid-cols-3 gap-3">
      <div>
        <label class="text-xs text-gray-500 mb-1 block">Status</label>
        <select name="status" class="border border-gray-200 rounded-lg px-3 py-2 text-sm bg-white w-full focus:outline-none focus:ring-1 focus:ring-[#378ADD]">
          {% for st in ["active", "offer", "rejected", "withdrawn", "ghosted"] %}
          <option value="{{ st }}" {% if process.status == st %}selected{% endif %}>{{ st | capitalize }}</option>
          {% endfor %}
        </select>
      </div>
      <div>
        <label class="text-xs text-gray-500 mb-1 block">Priority</label>
        <select name="priority" class="border border-gray-200 rounded-lg px-3 py-2 text-sm bg-white w-full focus:outline-none focus:ring-1 focus:ring-[#378ADD]">
          <option value="">—</option>
          {% for p in ["low", "medium", "high"] %}
          <option value="{{ p }}" {% if process.priority == p %}selected{% endif %}>{{ p | capitalize }}</option>
          {% endfor %}
        </select>
      </div>
      <div>
        <label class="text-xs text-gray-500 mb-1 block">Source</label>
        <input name="source" type="text" value="{{ process.source or '' }}"
               class="border border-gray-200 rounded-lg px-3 py-2 text-sm bg-white w-full focus:outline-none focus:ring-1 focus:ring-[#378ADD]" />
      </div>
    </div>

    <div class="grid grid-cols-3 gap-3">
      <div>
        <label class="text-xs text-gray-500 mb-1 block">Applied date</label>
        <input name="applied_date" type="date" value="{{ process.applied_date or '' }}"
               class="border border-gray-200 rounded-lg px-3 py-2 text-sm bg-white w-full focus:outline-none focus:ring-1 focus:ring-[#378ADD]" />
      </div>
      <div>
        <label class="text-xs text-gray-500 mb-1 block">Work regime</label>
        <select name="work_regime" class="border border-gray-200 rounded-lg px-3 py-2 text-sm bg-white w-full focus:outline-none focus:ring-1 focus:ring-[#378ADD]">
          <option value="">—</option>
          {% for wr in ["remote", "hybrid", "onsite"] %}
          <option value="{{ wr }}" {% if process.work_regime == wr %}selected{% endif %}>{{ wr | capitalize }}</option>
          {% endfor %}
        </select>
      </div>
      <div>
        <label class="text-xs text-gray-500 mb-1 block">Office days/month</label>
        <input name="office_days_per_month" type="number" step="0.5" value="{{ process.office_days_per_month if process.office_days_per_month is not none else '' }}"
               class="border border-gray-200 rounded-lg px-3 py-2 text-sm bg-white w-full focus:outline-none focus:ring-1 focus:ring-[#378ADD]" />
      </div>
    </div>

    <div class="grid grid-cols-3 gap-3">
      <div>
        <label class="text-xs text-gray-500 mb-1 block">Salary min</label>
        <input name="salary_min" type="number" value="{{ process.salary_min if process.salary_min is not none else '' }}"
               class="border border-gray-200 rounded-lg px-3 py-2 text-sm bg-white w-full focus:outline-none focus:ring-1 focus:ring-[#378ADD]" />
      </div>
      <div>
        <label class="text-xs text-gray-500 mb-1 block">Salary max</label>
        <input name="salary_max" type="number" value="{{ process.salary_max if process.salary_max is not none else '' }}"
               class="border border-gray-200 rounded-lg px-3 py-2 text-sm bg-white w-full focus:outline-none focus:ring-1 focus:ring-[#378ADD]" />
      </div>
      <div>
        <label class="text-xs text-gray-500 mb-1 block">Currency</label>
        <input name="salary_currency" type="text" maxlength="3" value="{{ process.salary_currency or '' }}"
               class="border border-gray-200 rounded-lg px-3 py-2 text-sm bg-white w-full focus:outline-none focus:ring-1 focus:ring-[#378ADD]" />
      </div>
    </div>

    <div>
      <label class="text-xs text-gray-500 mb-1 block">Office location</label>
      <input name="office_location" type="text" value="{{ process.office_location or '' }}"
             class="border border-gray-200 rounded-lg px-3 py-2 text-sm bg-white w-full focus:outline-none focus:ring-1 focus:ring-[#378ADD]" />
    </div>
    <div>
      <label class="text-xs text-gray-500 mb-1 block">Benefits</label>
      <textarea name="benefits" rows="2"
                class="border border-gray-200 rounded-lg px-3 py-2 text-sm bg-white w-full focus:outline-none focus:ring-1 focus:ring-[#378ADD]">{{ process.benefits or "" }}</textarea>
    </div>
    <div>
      <label class="text-xs text-gray-500 mb-1 block">Job posting URL</label>
      <input name="job_description_url" type="url" value="{{ process.job_description_url or '' }}"
             class="border border-gray-200 rounded-lg px-3 py-2 text-sm bg-white w-full focus:outline-none focus:ring-1 focus:ring-[#378ADD]" />
    </div>
    <div>
      <label class="text-xs text-gray-500 mb-1 block">Notes</label>
      <textarea name="notes" rows="2" placeholder="Personal notes (e.g. team/department)"
                class="border border-gray-200 rounded-lg px-3 py-2 text-sm bg-white w-full focus:outline-none focus:ring-1 focus:ring-[#378ADD]">{{ process.notes or "" }}</textarea>
    </div>

    <div class="flex justify-end gap-2 mt-1">
      <a href="/interviews/{{ process.id }}" class="btn btn-sm btn-ghost text-gray-500">Cancel</a>
      <button type="submit" class="btn btn-sm btn-primary">Save</button>
    </div>
  </form>
</div>
{% endblock %}
