<script>
async function placeSend(url, method, body) {
  const res = await fetch(url, {
    method, headers: { 'Content-Type': 'application/json' }, body: body === undefined ? undefined : JSON.stringify(body),
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error((data && data.error) || 'Something went wrong.');
  return data;
}

function placeBody(form) {
  const data = new FormData(form);
  const body = {
    name: data.get('name'),
    address: data.get('address') || null,
    maps_url: data.get('maps_url') || null,
    coordinates: (data.get('coordinates') || '').trim() || null,
    opening_hours: data.get('opening_hours') || null,
    notes: data.get('notes') || null,
    tags: (data.get('tags') || '').split(',').map((t) => t.trim()).filter(Boolean),
  };
  const kind = (data.get('kind') || '').trim();
  if (kind) body.kind = kind;
  const everydayBox = form.querySelector('[data-everyday-box]');
  if (everydayBox) body.everyday = everydayBox.checked;
  const sells = form.querySelector('[data-sells]');
  if (sells && !sells.classList.contains('hidden')) body.category_ids = data.getAll('category_ids').map(Number);
  if (form.cityPicker && form.cityPicker.touched()) body.city_id = form.cityPicker.value();
  return body;
}

document.querySelectorAll('[data-place-form]').forEach((form) => {
  // City picker: the place's city (the home city on a new place), required, "New city…" opens the shared dialog.
  form.cityPicker = initCityPicker({
    input: form.elements.city_text, idInput: form.elements.city_id, terminalInput: form.elements.city_text,
    newCity: initNewCityDialog({ dialog: document.getElementById('city-dialog'), send: async (method, url, body) => {
      const res = await fetch(url, { method, headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
      return { ok: res.ok, status: res.status, data: await res.json().catch(() => ({})) };
    } }),
  });
  form.cityPicker.reset(JSON.parse(form.querySelector('[data-city]').textContent));

  // New place: Everyday follows the kind until ticked by hand; Sells shows only for an everyday place.
  const box = form.querySelector('[data-everyday-box]');
  if (box) {
    const everydayKinds = new Set(form.dataset.everydayKinds.split(','));
    const sells = form.querySelector('[data-sells]');
    let byHand = false;
    const sync = () => sells?.classList.toggle('hidden', !box.checked);
    form.elements.kind.addEventListener('change', () => { if (!byHand) { box.checked = everydayKinds.has(form.elements.kind.value); sync(); } });
    box.addEventListener('change', () => { byHand = true; sync(); });
    box.checked = everydayKinds.has(form.elements.kind.value);
    sync();
  }

  // On success the page opens the saved place (with ?moved=1 when Home's address or city changed, so the page can
  // say what that does and does not update).
  form.addEventListener('submit', async (event) => {
    event.preventDefault();
    const error = form.querySelector('[data-form-error]');
    error.textContent = '';
    try {
      const saved = await placeSend(form.dataset.url, form.dataset.method, placeBody(form));
      const homeMoved = form.dataset.homeAddress !== undefined && saved.kind === 'home'
        && ((saved.address || '') !== form.dataset.homeAddress || String(saved.city.id) !== form.dataset.homeCity);
      window.location.href = `/places/${saved.id}${homeMoved ? '?moved=1' : ''}`;
    } catch (e) { error.textContent = e.message; }
  });
});
</script>
