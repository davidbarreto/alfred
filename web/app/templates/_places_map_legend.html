{# Pin colours by kind group, then the status styles; needs `groups` (MAP_GROUP_LABELS). #}
<div class="pm-legend" aria-label="Pin colours">
  {% for key, label in groups.items() %}<span><span class="pm-dot pm-group-{{ key }}"></span>{{ label }}</span>{% endfor %}
  <span><span class="pm-dot pm-dot-hollow"></span>Planned</span>
  <span><span class="pm-dot pm-dot-passed"></span>Passed through</span>
  <span><i class="ti ti-baby-carriage pm-born-key"></i>Born</span>
</div>
