{% extends "base.html" %}
{% set active_page = "finance" %}
{% block title %}Accounts{% endblock %}

{% block content %}
<div class="p-6 space-y-4 max-w-2xl">

  <div class="flex items-center gap-2">
    <a href="/finance" class="text-gray-400 hover:text-gray-600"><i class="ti ti-arrow-left text-sm"></i></a>
    <h1 class="text-base font-semibold text-gray-900">Accounts</h1>
  </div>

  <div class="bg-white border border-gray-200 rounded-lg p-4 space-y-4">
    <div id="accounts-list" hx-ext="loading-states">
      {% include "_finance_accounts.html" %}
    </div>

    <form
      class="flex flex-col sm:flex-row gap-2 pt-3 border-t border-gray-100"
      onsubmit="submitAccountsForm(event, '/finance/accounts', 'accounts-list')"
    >
      <input name="name" required placeholder="Name" class="border border-gray-200 rounded-lg px-3 py-1.5 text-sm w-full sm:flex-1 focus:outline-none focus:ring-1 focus:ring-[#378ADD]" />
      <select name="type" required class="border border-gray-200 rounded-lg px-3 py-1.5 text-sm w-full sm:w-auto focus:outline-none focus:ring-1 focus:ring-[#378ADD]">
        {% for t in ["checking","savings","credit","cash","investment","other"] %}
        <option value="{{ t }}">{{ t | capitalize }}</option>
        {% endfor %}
      </select>
      <select name="currency" class="border border-gray-200 rounded-lg px-3 py-1.5 text-sm w-full sm:w-auto focus:outline-none focus:ring-1 focus:ring-[#378ADD]">
        {% for c in currencies %}<option value="{{ c.code }}">{{ c.code }}</option>{% endfor %}
      </select>
      <input name="credit_limit" type="number" step="0.01" min="0" placeholder="Credit limit"
             class="border border-gray-200 rounded-lg px-3 py-1.5 text-sm w-full sm:w-28 focus:outline-none focus:ring-1 focus:ring-[#378ADD]"
             title="Only for credit cards — total limit of the card" />
      <button type="submit" class="btn btn-sm btn-primary w-full sm:w-auto">Add</button>
    </form>
  </div>

</div>

<script>
async function submitAccountsForm(e, url, targetId) {
  e.preventDefault();
  const form = e.target;
  const btn = form.querySelector('[type="submit"]');
  btn.disabled = true;
  try {
    const res = await fetch(url, { method: 'POST', body: new FormData(form) });
    if (!res.ok) throw new Error(await res.text());
    document.getElementById(targetId).innerHTML = await res.text();
    form.reset();
    htmx.process(document.getElementById(targetId));
  } catch (err) {
    alert(err.message || 'Failed.');
  } finally {
    btn.disabled = false;
  }
}
</script>
{% endblock %}
