{% extends "base.html" %}
{% set active_page = "cs" %}
{% block title %}CS — Problems{% endblock %}

{% block content %}
<div class="p-6 space-y-4">

  <!-- Breadcrumb -->
  <div class="flex items-center gap-2 text-xs text-gray-400">
    <a href="/cs" class="hover:text-gray-600">CS</a>
    <i class="ti ti-chevron-right text-gray-300"></i>
    <span class="text-gray-700 font-medium">Problems</span>
  </div>

  <h1 class="text-base font-semibold text-gray-900">Problems tried</h1>

  <!-- Filters -->
  <form method="get" action="/cs/problems" class="card bg-white">
    <div class="card-body p-4">
      <div class="flex flex-row flex-wrap items-end gap-3">
        <div>
          <label class="block text-xs text-gray-400 mb-1">Name</label>
          <input type="text" name="q" value="{{ filters.q or '' }}" placeholder="Search by name"
                 class="input input-sm input-bordered text-sm w-48">
        </div>
        <div>
          <label class="block text-xs text-gray-400 mb-1">Provider</label>
          <select name="platform_id" class="select select-sm select-bordered text-sm">
            <option value="">All</option>
            {% for p in platforms %}
            <option value="{{ p.id }}" {% if filters.platform_id == p.id | string %}selected{% endif %}>{{ p.code | title }}</option>
            {% endfor %}
          </select>
        </div>
        <div>
          <label class="block text-xs text-gray-400 mb-1">Difficulty</label>
          <select name="difficulty" class="select select-sm select-bordered text-sm">
            <option value="">All</option>
            {% for d in ["easy", "medium", "hard"] %}
            <option value="{{ d }}" {% if filters.difficulty == d %}selected{% endif %}>{{ d | title }}</option>
            {% endfor %}
          </select>
        </div>
        <div>
          <label class="block text-xs text-gray-400 mb-1">Category</label>
          <select name="tag" class="select select-sm select-bordered text-sm">
            <option value="">All</option>
            {% for t in tags %}
            <option value="{{ t }}" {% if filters.tag == t %}selected{% endif %}>{{ t | title }}</option>
            {% endfor %}
          </select>
        </div>
        <div>
          <label class="block text-xs text-gray-400 mb-1">Status</label>
          <select name="status" class="select select-sm select-bordered text-sm">
            <option value="">All</option>
            <option value="unsolved" {% if filters.status == "unsolved" %}selected{% endif %}>Unsolved</option>
            <option value="solved" {% if filters.status == "solved" %}selected{% endif %}>Solved</option>
          </select>
        </div>
        <button type="submit" class="btn btn-sm bg-[#378ADD] text-white hover:bg-[#2f7bc4] border-none">Apply</button>
        {% if filters %}
        <a href="/cs/problems" class="text-xs text-gray-400 hover:text-gray-600">Clear filters</a>
        {% endif %}
      </div>
    </div>
  </form>

  <div class="card bg-white">
    <div class="card-body p-0" id="problems-list"
         hx-get="/cs/problems-section?{{ filters | urlencode }}"
         hx-trigger="load"
         hx-swap="innerHTML">
      <div class="flex items-center justify-center py-16">
        <span class="loading loading-spinner loading-md text-[#378ADD]"></span>
      </div>
    </div>
  </div>

</div>
{% endblock %}
