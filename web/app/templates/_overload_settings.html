<form hx-post="/overload/settings" hx-target="#overload-settings" hx-swap="innerHTML" class="space-y-4">
  <div class="grid grid-cols-1 md:grid-cols-2 gap-x-8 gap-y-4">
    {% for title, rows in groups %}
    <fieldset class="space-y-2">
      <legend class="text-xs text-gray-400 uppercase tracking-wide mb-1">{{ title }}</legend>
      {% for field, label, unit, hint in rows %}
      <label class="flex items-center gap-2 text-sm text-gray-700" title="{{ hint }}">
        <span class="w-44 shrink-0">{{ label }}</span>
        <input type="number" name="{{ field }}" value="{{ values[field] }}" min="0" step="1"
               class="input input-sm input-bordered w-24">
        <span class="text-xs text-gray-400">{{ unit }}</span>
      </label>
      {% endfor %}
    </fieldset>
    {% endfor %}
  </div>
  <div class="flex items-center gap-3">
    <button type="submit" class="btn btn-sm btn-primary">Save</button>
    {% if saved %}<span class="text-xs text-[#639922]">Saved.</span>{% endif %}
    {% if error %}<span class="text-xs text-[#E24B4A]">{{ error }}</span>{% endif %}
  </div>
</form>
