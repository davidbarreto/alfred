{% extends "base.html" %}
{% set active_page = "cs" %}
{% block title %}CS Coach — Study plans{% endblock %}

{% block content %}
<div class="p-6 space-y-4">

  <!-- Breadcrumb -->
  <div class="flex items-center gap-2 text-xs text-gray-400">
    <a href="/cs" class="hover:text-gray-600">CS Coach</a>
    <i class="ti ti-chevron-right text-gray-300"></i>
    <span class="text-gray-700 font-medium">Study plans</span>
  </div>

  <h1 class="text-base font-semibold text-gray-900">Study plans</h1>

  <div class="card bg-white">
    <div class="card-body p-5" id="study-plans-list"
         hx-get="/cs/plans-list-section"
         hx-trigger="load"
         hx-swap="innerHTML">
      <div class="flex items-center justify-center py-16">
        <span class="loading loading-spinner loading-md text-[#378ADD]"></span>
      </div>
    </div>
  </div>

</div>
{% endblock %}
